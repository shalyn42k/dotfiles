[config]
reload_apps = false

[templates.quickshell]
input_path = "~/.config/matugen/templates/qs_colors.json.template"
output_path = "~/.config/hypr/scripts/quickshell/qs_colors.json"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf.template"
output_path = "~/.config/kitty/kitty-matugen-colors.conf"
# kitty перечитывает конфиг по SIGUSR1 (reload_conf_in_all_kitties в его utils.py),
# иначе новая тема доедет только до окон, открытых после смены обоев.
# `|| true`: без запущенного kitty pkill выходит с 1 и роняет хук.
post_hook = "pkill -USR1 kitty || true"

[templates.neovim]
input_path = "~/.config/matugen/templates/nvim-colors.lua.template"
output_path = "~/.config/nvim/matugen_colors.lua"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors.ini.template"
output_path = "~/.config/cava/colors"

[templates.swayosd]
input_path = "~/.config/matugen/templates/swayosd.css.template"
output_path = "~/.config/swayosd/style.css"

[templates.gtk]
input_path = "~/.config/matugen/templates/gtk.css.template"
output_path = "~/.cache/matugen/colors-gtk.css"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct.conf.template"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct.conf.template"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt5_style]
input_path = "~/.config/matugen/templates/qt-style.qss.template"
output_path = "~/.config/qt5ct/qss/matugen-style.qss"

[templates.qt6_style]
input_path = "~/.config/matugen/templates/qt-style.qss.template"
output_path = "~/.config/qt6ct/qss/matugen-style.qss"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.conf.template'
output_path = '~/.config/hypr/colors.conf'

# тема Discord (Vencord) для рига ilyamiro — dotprofile копирует в themes/rig.theme.css
[templates.discord]
input_path = "~/.config/matugen/templates/discord.css.template"
output_path = "~/.cache/matugen/discord-caelestia.theme.css"

# тема Obsidian этого рига — dotprofile копирует в vault/.obsidian/snippets/
[templates.obsidian]
input_path = "~/.config/matugen/templates/obsidian.css.template"
output_path = "~/.cache/matugen/obsidian-caelestia.css"
