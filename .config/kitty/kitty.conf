# Главный терминал обоих ригов. Раньше эту роль играл foot, и настройки ниже
# намеренно повторяют его .config/foot/foot.ini — сопоставление в комментариях,
# чтобы при расхождении поведения было видно, откуда взялось значение.

# foot: shell=fish
shell fish

# foot: font=JetBrains Mono Nerd Font:size=12
# Nerd-вариант обязателен: глифы в starship-промпте и fastfetch берутся оттуда.
font_family      JetBrains Mono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# foot: bold-text-in-bright=no — аналога не нужно. Опции с таким смыслом в
# kitty нет: он в принципе не подменяет жирный текст ярким цветом палитры,
# то есть ведёт себя ровно как foot с выключённой настройкой.

# foot: pad=25x25
window_padding_width 25

# foot: [scrollback] lines=10000
scrollback_lines 10000
wheel_scroll_min_lines 1

# foot: [colors-dark] alpha=0.5
background_opacity 0.5

# ── Курсор ──────────────────────────────────────────────────────────────────
# foot: style=beam / beam-thickness=1.5 / blink=yes / blink-rate=250
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.25
# foot мигает, пока окно в фокусе, и не прекращает. У kitty дефолт — стоп через
# 15 секунд, поэтому явный 0.
cursor_stop_blinking_after 0

# Ради чего вообще перешли с foot: трейл курсора. foot его не умеет —
# codeberg.org/dnkl/foot/issues/1980 закрыт как wontfix.
cursor_trail 1
cursor_trail_decay 0.1 0.4

# ── Прочее, как было в kitty ────────────────────────────────────────────────
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes

# ── Клавиши ─────────────────────────────────────────────────────────────────
# foot: [key-bindings] scrollback-up-page / scrollback-down-page
map page_up   scroll_page_up
map page_down scroll_page_down

# foot: search-start=Control+Shift+f
# Точного аналога нет: инкрементального поиска по буферу в kitty не существует.
# Ближайшее — вывалить скроллбек в пейджер, где ищет уже он (`/` в less).
map ctrl+shift+f show_scrollback

# ── Цвета ───────────────────────────────────────────────────────────────────
# Базовая палитра — фолбэк на случай, если matugen ещё не рендерил тему рига.
include colors.conf
# Тема активного рига поверх базовой. Файл генерится matugen'ом на каждую смену
# обоев (путь задан в profiles/*/matugen/config.toml) и в git не попадает.
# globinclude, а не include: когда файла ещё нет, kitty молча пропускает его,
# тогда как include в такой ситуации сыплет ошибкой в лог.
globinclude kitty-matugen-colors.conf
